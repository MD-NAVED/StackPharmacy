<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 480" width="1620" height="480" fill="none">
  <svg x="54" y="60" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="360" height="360" fill="none" role="img" aria-label="StackPharmacy Logo">
  <defs>
    <mask id="sp-hd-cut-mid" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF" />
      <rect x="246" y="114" width="186" height="308" rx="28" ry="28" fill="#000000" stroke="#000000" stroke-width="18" />
    </mask>
    <mask id="sp-hd-cut-back" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF" />
      <g transform="rotate(-22 252 402)">
        <rect x="246" y="114" width="186" height="308" rx="28" ry="28" fill="#000000" stroke="#000000" stroke-width="18" />
      </g>
      <rect x="246" y="114" width="186" height="308" rx="28" ry="28" fill="#000000" stroke="#000000" stroke-width="18" />
    </mask>
    
  </defs>

  <!-- Back slab (-44 deg) -->
  <g transform="translate(22 10)">
    <g mask="url(#sp-hd-cut-back)">
      <g transform="rotate(-44 252 402)">
        <rect x="246" y="114" width="186" height="308" rx="28" ry="28" fill="#117065" />
      </g>
    </g>

    <!-- Middle slab (-22 deg) -->
    <g mask="url(#sp-hd-cut-mid)">
      <g transform="rotate(-22 252 402)">
        <rect x="246" y="114" width="186" height="308" rx="28" ry="28" fill="#14B8A6" />
      </g>
    </g>

    <!-- Front emerald slab + medical cross -->
    <g>
      <rect x="246" y="114" width="186" height="308" rx="28" ry="28" fill="#34D399" />
    </g>
    <g fill="#FFFFFF">
      <rect x="287" y="251" width="104" height="34" rx="4" />
      <rect x="322" y="216" width="34" height="104" rx="4" />
    </g>
  </g>
</svg>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="454" y="264" font-size="148" font-weight="800" letter-spacing="-3" fill="#FFFFFF">StackPharmacy</text>
    <text x="460" y="346" font-size="28" font-weight="600" letter-spacing="4" fill="#CBD5E1">SMART STOCK &amp; EXPIRY GUARD</text>
  </g>
</svg>